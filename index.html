<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Lector QR - Bienes</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      padding: 10px;

      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );
    }

    .contenedor {

      width: 100%;

      max-width: 520px;

      margin: 0 auto;

      background: white;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,.20);
    }

    .encabezado {

      background: #4CAF50;

      color: white;

      text-align: center;

      padding: 24px 15px;
    }

    .encabezado h1 {

      margin: 0 0 5px;

      font-size: 23px;
    }

    .encabezado p {

      margin: 0;

      font-size: 14px;
    }

    .contenido {

      padding: 15px;
    }

    .estado {

      text-align: center;

      padding: 13px;

      margin-bottom: 15px;

      border-radius: 10px;

      background: #f1f3f5;

      color: #555;

      font-weight: bold;
    }

    .estado.error {

      background: #f8d7da;

      color: #721c24;
    }

    #reader {

      width: 100%;

      margin: 0 auto 15px;

      border-radius: 12px;

      overflow: hidden;

      background: #000;
    }

    #reader video {

      width: 100% !important;

      height: auto !important;
    }

    button {

      width: 100%;

      min-height: 54px;

      padding: 14px;

      margin-bottom: 10px;

      border: none;

      border-radius: 11px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

    #btn-camara {

      background: #4CAF50;

      color: white;
    }

    #btn-detener {

      background: #dc3545;

      color: white;

      display: none;
    }

    #resultado {

      display: none;

      margin-top: 15px;

      padding: 15px;

      border-radius: 10px;

      text-align: center;

      background: #d4edda;

      color: #155724;

      font-weight: bold;

      word-break: break-word;
    }

    .instrucciones {

      margin-top: 12px;

      padding: 12px;

      border-radius: 10px;

      background: #e3f2fd;

      color: #1565c0;

      font-size: 13px;

      text-align: center;
    }

  </style>

</head>


<body>


<div class="contenedor">


  <div class="encabezado">

    <h1>
      📷 LECTOR QR
    </h1>

    <p>
      Control de Bienes
    </p>

  </div>


  <div class="contenido">


    <div
      id="estado"
      class="estado">

      📷 Cámara desactivada

    </div>


    <div id="reader"></div>


    <button
      id="btn-camara"
      type="button"
      onclick="iniciarCamara()">

      📷 ACTIVAR CÁMARA

    </button>


    <button
      id="btn-detener"
      type="button"
      onclick="detenerCamara()">

      🛑 DETENER CÁMARA

    </button>


    <div id="resultado"></div>


    <div class="instrucciones">

      Apunte la cámara hacia el código QR
      de la ficha.

      <br><br>

      El sistema utilizará únicamente
      los números de la ficha.

    </div>


  </div>

</div>


<script>


/* ==========================================================
   URL ÚNICA DE APPS SCRIPT
   ========================================================== */

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbxKpsR2pL2tULdxnfot9DM_vJOic-PshIfXVZEarIQZB_nGrabyahTHVYX3Cc8BUESM/exec";


let lector = null;

let escaneando = false;

let procesando = false;


/* ==========================================================
   NORMALIZAR QR
   ========================================================== */

function obtenerFicha(
  texto
) {

  if (!texto)
    return "";

  /*
   * Ejemplos:
   *
   * SIAFI-21026 → 21026
   * SIAFI 21026 → 21026
   * 21026       → 21026
   */

  return String(
    texto
  )
    .replace(
      /\D/g,
      ""
    )
    .trim();

}


/* ==========================================================
   ESTADO
   ========================================================== */

function mostrarEstado(
  mensaje,
  error = false
) {

  const estado =
    document.getElementById(
      "estado"
    );

  estado.textContent =
    mensaje;

  estado.classList.toggle(
    "error",
    error
  );

}


/* ==========================================================
   INICIAR CÁMARA
   ========================================================== */

async function iniciarCamara() {

  if (escaneando)
    return;


  try {

    mostrarEstado(
      "🎥 Solicitando permiso para usar la cámara..."
    );


    const reader =
      document.getElementById(
        "reader"
      );


    reader.style.display =
      "block";


    document.getElementById(
      "btn-camara"
    ).style.display =
      "none";


    document.getElementById(
      "btn-detener"
    ).style.display =
      "block";


    lector =
      new Html5Qrcode(
        "reader"
      );


    const configuracion = {

      fps: 10,

      qrbox: function(
        ancho,
        alto
      ) {

        const tamaño =
          Math.min(
            ancho * 0.75,
            alto * 0.75,
            300
          );

        return {

          width:
            tamaño,

          height:
            tamaño

        };

      },

      aspectRatio: 1.0,

      disableFlip: false

    };


    await lector.start(

      {
        facingMode:
          "environment"
      },

      configuracion,

      function(textoQR) {

        procesarQR(
          textoQR
        );

      },

      function() {}

    );


    escaneando =
      true;


    mostrarEstado(
      "📷 Cámara funcionando. Apunte al QR."
    );

  }

  catch(error) {

    console.error(
      error
    );


    escaneando =
      false;


    document.getElementById(
      "reader"
    ).style.display =
      "none";


    document.getElementById(
      "btn-camara"
    ).style.display =
      "block";


    document.getElementById(
      "btn-detener"
    ).style.display =
      "none";


    let mensaje =
      "❌ No se pudo acceder a la cámara.";

    if (
      error &&
      error.name ===
      "NotAllowedError"
    ) {

      mensaje =
        "❌ El navegador bloqueó el acceso a la cámara.";

    }

    mostrarEstado(
      mensaje,
      true
    );

  }

}


/* ==========================================================
   DETENER
   ========================================================== */

async function detenerCamara() {

  try {

    if (
      lector &&
      escaneando
    ) {

      await lector.stop();

    }

    if (lector) {

      await lector.clear();

    }

  }

  catch(error) {

    console.warn(
      error
    );

  }


  lector =
    null;

  escaneando =
    false;


  document.getElementById(
    "reader"
  ).style.display =
    "none";


  document.getElementById(
    "btn-camara"
  ).style.display =
    "block";


  document.getElementById(
    "btn-detener"
  ).style.display =
    "none";


  mostrarEstado(
    "📷 Cámara desactivada"
  );

}


/* ==========================================================
   PROCESAR QR
   ========================================================== */

function procesarQR(
  textoQR
) {

  if (procesando)
    return;


  procesando =
    true;


  const ficha =
    obtenerFicha(
      textoQR
    );


  if (!ficha) {

    procesando =
      false;

    mostrarEstado(
      "❌ El QR no contiene un número de ficha.",
      true
    );

    return;

  }


  document.getElementById(
    "resultado"
  ).textContent =
    "✅ QR detectado: " +
    ficha;


  document.getElementById(
    "resultado"
  ).style.display =
    "block";


  mostrarEstado(
    "✅ Ficha " +
    ficha +
    " detectada. Abriendo control..."
  );


  detenerCamara();


  /*
   * ========================================================
   * AQUÍ SE ENVÍA A APPS SCRIPT
   *
   * SOLO UNA VEZ
   * ========================================================
   */

  const destino =
    URL_APPS_SCRIPT +
    "?ficha=" +
    encodeURIComponent(
      ficha
    );


  setTimeout(
    function() {

      window.location.assign(
        destino
      );

    },
    500
  );

}

</script>


</body>

</html>
