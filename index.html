<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Lector QR - Bienes</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing:border-box;
}

body {

  margin:0;
  padding:15px;

  min-height:100vh;

  font-family:
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #667eea,
      #764ba2
    );

}

.contenedor {

  max-width:500px;

  margin:0 auto;

  background:white;

  border-radius:15px;

  overflow:hidden;

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.2);

}

.encabezado {

  background:#4CAF50;

  color:white;

  text-align:center;

  padding:22px 15px;

}

.encabezado h1 {

  margin:0 0 5px;

  font-size:23px;

}

.encabezado p {

  margin:0;

  font-size:14px;

}

.contenido {

  padding:20px;

}

.estado {

  text-align:center;

  padding:12px;

  margin-bottom:15px;

  border-radius:10px;

  background:#f1f3f5;

  color:#555;

  font-weight:bold;

}

#reader {

  width:100%;

  max-width:400px;

  margin:0 auto 20px;

  display:none;

  border-radius:12px;

  overflow:hidden;

  background:#000;

}

#reader video {

  width:100% !important;

  height:auto !important;

}

button {

  width:100%;

  padding:15px;

  margin-bottom:10px;

  border:none;

  border-radius:10px;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

}

#btn-camara {

  background:#4CAF50;

  color:white;

}

#btn-detener {

  background:#dc3545;

  color:white;

  display:none;

}

#resultado {

  display:none;

  margin-top:15px;

  padding:15px;

  border-radius:10px;

  text-align:center;

  background:#d4edda;

  color:#155724;

  font-weight:bold;

  word-break:break-word;

}

.instrucciones {

  margin-top:15px;

  padding:12px;

  border-radius:10px;

  background:#e3f2fd;

  color:#1565c0;

  font-size:13px;

  text-align:center;

}

.error {

  background:#f8d7da;

  color:#721c24;

}

</style>

</head>


<body>


<div class="contenedor">


<div class="encabezado">

<h1>
📷 LECTOR QR
</h1>

<p>
Control de Bienes
</p>

</div>


<div class="contenido">


<div
  id="estado"
  class="estado">

📷 Cámara desactivada

</div>


<div id="reader"></div>


<button
  id="btn-camara"
  onclick="iniciarCamara()">

📷 Activar cámara

</button>


<button
  id="btn-detener"
  onclick="detenerCamara()">

🛑 Detener cámara

</button>


<div id="resultado"></div>


<div class="instrucciones">

Apunte la cámara hacia el código QR
de la ficha.

<br><br>

<strong>
El QR debe contener solamente el número
de la ficha.
</strong>

</div>


</div>

</div>


<script>


/* ==========================================================
   URL DEFINITIVA DE APPS SCRIPT
========================================================== */

const URL_WEB_APP =
"https://script.google.com/macros/s/AKfycbxKpsR2pL2tULdxnfot9DM_vJOic-PshIfXVZEarIQZB_nGrabyahTHVYX3Cc8BUESM/exec";


let lector = null;

let escaneando = false;

let ultimoQR = "";

let ultimaLectura = 0;


/* ==========================================================
   ESTADO
========================================================== */

function mostrarEstado(
  mensaje,
  error = false
) {

  const estado =
    document.getElementById(
      "estado"
    );

  estado.textContent =
    mensaje;

  estado.classList.toggle(
    "error",
    error
  );

}


/* ==========================================================
   RESULTADO
========================================================== */

function mostrarResultado(
  texto
) {

  const resultado =
    document.getElementById(
      "resultado"
    );

  resultado.textContent =
    "✅ QR detectado: " +
    texto;

  resultado.style.display =
    "block";

}


/* ==========================================================
   NORMALIZAR QR
==========================================================

   Acepta:

   21026
   SIAFI-21026
   SIAFI 21026

   Y envía solamente:

   21026
========================================================== */

function normalizarQR(
  texto
) {

  let valor =
    String(
      texto || ""
    )
    .trim()
    .toUpperCase();


  valor =
    valor.replace(
      /^SIAFI[-\s:]*/i,
      ''
    );


  valor =
    valor.replace(
     (/\D/g),
      ''
    );


  return valor;

}


/* ==========================================================
   INICIAR CÁMARA
========================================================== */

async function iniciarCamara() {

  if (escaneando)
    return;


  const reader =
    document.getElementById(
      "reader"
    );

  const boton =
    document.getElementById(
      "btn-camara"
    );

  const detener =
    document.getElementById(
      "btn-detener"
    );


  mostrarEstado(
    "🎥 Solicitando permiso para usar la cámara..."
  );


  try {

    /*
     * PRIMERA COMPROBACIÓN
     *
     * Esto hace que el navegador
     * solicite permiso correctamente.
     */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "CAMERA_NOT_SUPPORTED"
      );

    }


    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              {
                ideal:
                  "environment"
              }

          },

          audio:false

        });


    /*
     * Cerramos este permiso temporal.
     * html5-qrcode abrirá la cámara nuevamente.
     */

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    reader.style.display =
      "block";

    boton.style.display =
      "none";

    detener.style.display =
      "block";


    lector =
      new Html5Qrcode(
        "reader"
      );


    const configuracion = {

      fps:10,

      qrbox:function(
        ancho,
        alto
      ) {

        const tamaño =
          Math.min(
            ancho * 0.75,
            alto * 0.75,
            300
          );


        return {

          width:
            tamaño,

          height:
            tamaño

        };

      },

      aspectRatio:1.0,

      disableFlip:false

    };


    await lector.start(

      {
        facingMode:
          "environment"
      },

      configuracion,

      function(textoQR) {

        procesarQR(
          textoQR
        );

      },

      function() {}

    );


    escaneando =
      true;


    mostrarEstado(
      "📷 Cámara funcionando. Apunte al código QR."
    );


  }

  catch(error) {

    console.error(
      "ERROR DE CÁMARA:",
      error
    );


    reader.style.display =
      "none";

    boton.style.display =
      "block";

    detener.style.display =
      "none";


    let mensaje =
      "❌ No se pudo acceder a la cámara.";


    if (
      error &&
      error.name ===
      "NotAllowedError"
    ) {

      mensaje =
        "❌ El navegador bloqueó el acceso a la cámara. Permita la cámara para este sitio.";

    }

    else if (
      error &&
      error.name ===
      "NotFoundError"
    ) {

      mensaje =
        "❌ No se encontró una cámara disponible.";

    }

    else if (
      error &&
      error.name ===
      "NotReadableError"
    ) {

      mensaje =
        "❌ La cámara está siendo utilizada por otra aplicación.";

    }

    else if (
      error &&
      error.name ===
      "SecurityError"
    ) {

      mensaje =
        "❌ El navegador bloqueó el acceso por seguridad.";

    }

    else if (
      error &&
      error.message ===
      "CAMERA_NOT_SUPPORTED"
    ) {

      mensaje =
        "❌ Este navegador no permite utilizar la cámara.";

    }


    mostrarEstado(
      mensaje,
      true
    );

  }

}


/* ==========================================================
   DETENER CÁMARA
========================================================== */

async function detenerCamara() {

  try {

    if (
      lector &&
      escaneando
    ) {

      await lector.stop();

    }


    if (lector) {

      await lector.clear();

    }

  }

  catch(error) {

    console.warn(
      error
    );

  }


  lector =
    null;

  escaneando =
    false;


  document.getElementById(
    "reader"
  ).style.display =
    "none";


  document.getElementById(
    "btn-camara"
  ).style.display =
    "block";


  document.getElementById(
    "btn-detener"
  ).style.display =
    "none";


  mostrarEstado(
    "📷 Cámara desactivada"
  );

}


/* ==========================================================
   PROCESAR QR
========================================================== */

function procesarQR(
  textoQR
) {

  const ahora =
    Date.now();


  /*
   * Convertimos el QR a solamente
   * números.
   */

  const ficha =
    normalizarQR(
      textoQR
    );


  if (!ficha) {

    mostrarEstado(
      "❌ El QR no contiene un número de ficha.",
      true
    );

    return;

  }


  /*
   * Evita lecturas repetidas.
   */

  if (
    ficha === ultimoQR &&
    ahora - ultimaLectura < 3000
  ) {

    return;

  }


  ultimoQR =
    ficha;

  ultimaLectura =
    ahora;


  mostrarResultado(
    ficha
  );


  mostrarEstado(
    "✅ Código detectado. Abriendo Control de Bienes..."
  );


  detenerCamara();


  /*
   * AQUÍ ESTÁ LA PARTE IMPORTANTE.
   *
   * GitHub manda directamente a:
   *
   * Apps Script ?ficha=21026
   */

  const destino =
    URL_WEB_APP +
    "?ficha=" +
    encodeURIComponent(
      ficha
    );


  console.log(
    "REDIRIGIENDO A:",
    destino
  );


  setTimeout(
    function() {

      window.location.assign(
        destino
      );

    },
    500
  );

}


</script>

</body>

</html>
