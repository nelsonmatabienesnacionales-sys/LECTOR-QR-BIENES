<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba Cámara QR</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #667eea;
}

.contenedor {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

h1 {
  text-align: center;
}

#estado {
  padding: 15px;
  margin-bottom: 15px;
  background: #eee;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
}

#reader {
  width: 100%;
  display: none;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #4CAF50;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

#resultado {
  margin-top: 15px;
  padding: 15px;
  background: #d4edda;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>📷 PRUEBA DE CÁMARA</h1>

<div id="estado">
📷 Cámara desactivada
</div>

<div id="reader"></div>

<button onclick="activarCamara()">
📷 ACTIVAR CÁMARA
</button>

<div id="resultado"></div>

</div>

<script>

let scanner = null;

async function activarCamara() {

  const estado =
    document.getElementById("estado");

  const reader =
    document.getElementById("reader");

  estado.textContent =
    "🎥 Abriendo cámara...";

  reader.style.display =
    "block";

  try {

    scanner =
      new Html5Qrcode("reader");

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      function(texto) {

        document.getElementById(
          "resultado"
        ).textContent =
          "✅ QR DETECTADO: " + texto;

      },

      function(error) {

        // Ignorar errores normales
        // mientras busca el QR

      }

    );

    estado.textContent =
      "📷 CÁMARA FUNCIONANDO";

  }

  catch(error) {

    console.error(error);

    estado.textContent =
      "❌ ERROR: " +
      (error.message || error);

  }

}

</script>

</body>
</html>
