<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="apple-mobile-web-app-capable"
  content="yes">

<meta
  name="mobile-web-app-capable"
  content="yes">

<title>Lector QR - Bienes</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;
  padding: 15px;

  min-height: 100vh;

  font-family:
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #667eea,
      #764ba2
    );

}

.contenedor {

  width: 100%;
  max-width: 500px;

  margin: 0 auto;

  background: white;

  border-radius: 15px;

  overflow: hidden;

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.2);

}

.encabezado {

  background: #4CAF50;

  color: white;

  text-align: center;

  padding: 22px 15px;

}

.encabezado h1 {

  margin: 0 0 5px;

  font-size: 23px;

}

.encabezado p {

  margin: 0;

  font-size: 14px;

}

.contenido {

  padding: 20px;

}

.estado {

  text-align: center;

  padding: 12px;

  margin-bottom: 15px;

  border-radius: 10px;

  background: #f1f3f5;

  color: #555;

  font-weight: bold;

}

#reader {

  width: 100%;

  max-width: 400px;

  margin: 0 auto 20px;

  display: none;

  border-radius: 12px;

  overflow: hidden;

  background: #000;

}

#reader video {

  width: 100% !important;

  height: auto !important;

}

button {

  width: 100%;

  padding: 15px;

  margin-bottom: 10px;

  border: none;

  border-radius: 10px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}

#btn-camara {

  background: #4CAF50;

  color: white;

}

#btn-detener {

  background: #dc3545;

  color: white;

  display: none;

}

#resultado {

  display: none;

  margin-top: 15px;

  padding: 15px;

  border-radius: 10px;

  text-align: center;

  background: #d4edda;

  color: #155724;

  font-weight: bold;

  word-break: break-word;

}

.instrucciones {

  margin-top: 15px;

  padding: 12px;

  border-radius: 10px;

  background: #e3f2fd;

  color: #1565c0;

  font-size: 13px;

  text-align: center;

}

.error {

  background: #f8d7da;

  color: #721c24;

}

</style>

</head>


<body>


<div class="contenedor">


<div class="encabezado">

<h1>
📷 LECTOR QR
</h1>

<p>
Control de Bienes
</p>

</div>


<div class="contenido">


<div
  id="estado"
  class="estado">

📷 Cámara desactivada

</div>


<div id="reader"></div>


<button
  id="btn-camara"
  type="button">

📷 ACTIVAR CÁMARA

</button>


<button
  id="btn-detener"
  type="button">

🛑 DETENER CÁMARA

</button>


<div id="resultado"></div>


<div class="instrucciones">

Apunte la cámara hacia el código QR
de la ficha.

<br><br>

La cámara se utiliza únicamente
para leer códigos QR.

</div>


</div>

</div>


<script>


/* ==========================================================
   URL DE APPS SCRIPT
   ========================================================== */

const URL_WEB_APP =
  "https://script.google.com/macros/s/AKfycbxKpsR2pL2tULdxnfot9DM_vJOic-PshIfXVZEarIQZB_nGrabyahTHVYX3Cc8BUESM/exec";


/* ==========================================================
   VARIABLES
   ========================================================== */

let lector = null;

let escaneando = false;

let procesando = false;


/* ==========================================================
   ELEMENTOS
   ========================================================== */

const estado =
  document.getElementById(
    "estado"
  );

const reader =
  document.getElementById(
    "reader"
  );

const botonCamara =
  document.getElementById(
    "btn-camara"
  );

const botonDetener =
  document.getElementById(
    "btn-detener"
  );

const resultado =
  document.getElementById(
    "resultado"
  );


/* ==========================================================
   ESTADO
   ========================================================== */

function mostrarEstado(
  mensaje,
  error = false
) {

  estado.textContent =
    mensaje;

  estado.classList.toggle(
    "error",
    error
  );

}


/* ==========================================================
   NORMALIZAR QR
   ==========================================================

   Ejemplos:

   SIAFI-21026 → 21026

   SIAFI 21026 → 21026

   21026 → 21026

   Solo se enviarán números a Apps Script.
   ========================================================== */

function normalizarFicha(
  texto
) {

  if (
    texto === null ||
    texto === undefined
  ) {

    return "";

  }


  let valor =
    String(texto)
      .trim()
      .toUpperCase();


  valor =
    valor.replace(
      /^SIAFI[-\s:]*/i,
      ""
    );


  valor =
    valor.replace(
      /\D/g,
      ""
    );


  return valor;

}


/* ==========================================================
   MOSTRAR RESULTADO
   ========================================================== */

function mostrarResultado(
  texto
) {

  resultado.textContent =
    "✅ QR detectado: " +
    texto;

  resultado.style.display =
    "block";

}


/* ==========================================================
   INICIAR CÁMARA
   ========================================================== */

async function iniciarCamara() {

  if (escaneando)
    return;


  procesando =
    false;


  resultado.style.display =
    "none";


  mostrarEstado(
    "🎥 Solicitando permiso para usar la cámara..."
  );


  try {


    /*
     * Comprobamos que el navegador
     * tenga acceso a cámara.
     */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "CAMERA_NOT_SUPPORTED"
      );

    }


    /*
     * Primero solicitamos permiso.
     *
     * Esto es importante especialmente
     * en teléfonos.
     */

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              {
                ideal:
                  "environment"
              }

          },

          audio:false

        });


    /*
     * Cerramos esta prueba.
     *
     * html5-qrcode abrirá después
     * la cámara correctamente.
     */

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    reader.style.display =
      "block";


    botonCamara.style.display =
      "none";


    botonDetener.style.display =
      "block";


    lector =
      new Html5Qrcode(
        "reader"
      );


    const configuracion = {

      fps:10,

      qrbox:function(
        ancho,
        alto
      ) {

        const tamano =
          Math.min(
            ancho * 0.75,
            alto * 0.75,
            300
          );


        return {

          width:
            tamano,

          height:
            tamano

        };

      },

      aspectRatio:1.0,

      disableFlip:false

    };


    await lector.start(

      {
        facingMode:
          "environment"
      },

      configuracion,

      function(textoQR) {

        procesarQR(
          textoQR
        );

      },

      function() {}

    );


    escaneando =
      true;


    mostrarEstado(
      "📷 Cámara funcionando. Apunte al código QR."
    );


  }

  catch(error) {

    console.error(
      "ERROR CÁMARA:",
      error
    );


    reader.style.display =
      "none";


    botonCamara.style.display =
      "block";


    botonDetener.style.display =
      "none";


    let mensaje =
      "❌ No se pudo acceder a la cámara.";


    if (
      error &&
      error.name ===
      "NotAllowedError"
    ) {

      mensaje =
        "❌ El navegador bloqueó el acceso a la cámara. Permita la cámara para este sitio.";

    }

    else if (
      error &&
      error.name ===
      "NotFoundError"
    ) {

      mensaje =
        "❌ No se encontró una cámara disponible.";

    }

    else if (
      error &&
      error.name ===
      "NotReadableError"
    ) {

      mensaje =
        "❌ La cámara está siendo utilizada por otra aplicación.";

    }

    else if (
      error &&
      error.name ===
      "SecurityError"
    ) {

      mensaje =
        "❌ El navegador bloqueó la cámara por seguridad.";

    }

    else if (
      error &&
      error.message ===
      "CAMERA_NOT_SUPPORTED"
    ) {

      mensaje =
        "❌ Este navegador no permite utilizar la cámara desde esta página.";

    }


    mostrarEstado(
      mensaje,
      true
    );

  }

}


/* ==========================================================
   DETENER CÁMARA
   ========================================================== */

async function detenerCamara() {

  try {

    if (
      lector &&
      escaneando
    ) {

      await lector.stop();

    }

  }

  catch(error) {

    console.warn(
      error
    );

  }


  try {

    if (lector) {

      await lector.clear();

    }

  }

  catch(error) {

    console.warn(
      error
    );

  }


  lector =
    null;

  escaneando =
    false;

  procesando =
    false;


  reader.style.display =
    "none";


  botonCamara.style.display =
    "block";


  botonDetener.style.display =
    "none";


  mostrarEstado(
    "📷 Cámara desactivada"
  );

}


/* ==========================================================
   PROCESAR QR
   ========================================================== */

async function procesarQR(
  textoQR
) {

  if (procesando)
    return;


  const ficha =
    normalizarFicha(
      textoQR
    );


  if (!ficha) {

    return;

  }


  procesando =
    true;


  mostrarResultado(
    ficha
  );


  mostrarEstado(
    "✅ Código detectado. Abriendo ficha..."
  );


  /*
   * Detener cámara antes de salir.
   */

  try {

    if (
      lector &&
      escaneando
    ) {

      await lector.stop();

    }

  }

  catch(error) {

    console.warn(
      error
    );

  }


  /*
   * IMPORTANTE:
   *
   * No usamos window.open.
   *
   * No usamos iframe.
   *
   * No usamos una URL intermedia.
   *
   * Vamos directamente a Apps Script.
   */

  const destino =
    URL_WEB_APP +
    "?ficha=" +
    encodeURIComponent(
      ficha
    );


  /*
   * Una pequeña pausa permite
   * cerrar correctamente la cámara
   * antes de cambiar de página.
   */

  setTimeout(
    function() {

      window.location.href =
        destino;

    },
    300
  );

}


/* ==========================================================
   EVENTOS
   ========================================================== */

botonCamara.addEventListener(
  "click",
  iniciarCamara
);


botonDetener.addEventListener(
  "click",
  detenerCamara
);


/* ==========================================================
   INICIO
   ========================================================== */

window.addEventListener(
  "load",
  function() {

    mostrarEstado(
      "📷 Cámara desactivada"
    );

  }
);

</script>

</body>

</html>
