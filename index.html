<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Lector QR - Bienes</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;
  padding: 15px;

  min-height: 100vh;

  font-family: Arial, sans-serif;

  background:
    linear-gradient(
      135deg,
      #667eea,
      #764ba2
    );

}

.contenedor {

  max-width: 500px;

  margin: 0 auto;

  background: white;

  border-radius: 15px;

  overflow: hidden;

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.20);

}

.encabezado {

  background: #4CAF50;

  color: white;

  text-align: center;

  padding: 22px 15px;

}

.encabezado h1 {

  margin: 0 0 5px;

  font-size: 23px;

}

.encabezado p {

  margin: 0;

  font-size: 14px;

}

.contenido {

  padding: 20px;

}

.estado {

  text-align: center;

  padding: 15px;

  margin-bottom: 15px;

  border-radius: 10px;

  background: #f1f3f5;

  color: #555;

  font-weight: bold;

}

#reader {

  width: 100%;

  max-width: 400px;

  margin: 0 auto 20px;

  display: none;

  border-radius: 12px;

  overflow: hidden;

  background: #000;

}

#reader video {

  width: 100% !important;

  height: auto !important;

}

button {

  width: 100%;

  padding: 15px;

  margin-bottom: 10px;

  border: none;

  border-radius: 10px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}

#btn-camara {

  background: #4CAF50;

  color: white;

}

#btn-detener {

  background: #dc3545;

  color: white;

  display: none;

}

#btn-ir {

  background: #2196F3;

  color: white;

  display: none;

}

#btn-nuevo {

  background: #6c757d;

  color: white;

  display: none;

}

#resultado {

  display: none;

  margin-top: 15px;

  margin-bottom: 15px;

  padding: 15px;

  border-radius: 10px;

  text-align: center;

  background: #d4edda;

  color: #155724;

  font-weight: bold;

  word-break: break-word;

}

.instrucciones {

  margin-top: 15px;

  padding: 12px;

  border-radius: 10px;

  background: #e3f2fd;

  color: #1565c0;

  font-size: 13px;

  text-align: center;

}

.error {

  background: #f8d7da;

  color: #721c24;

}

</style>

</head>


<body>


<div class="contenedor">


<div class="encabezado">

<h1>
📷 LECTOR QR
</h1>

<p>
Control de Bienes
</p>

</div>


<div class="contenido">


<div
  id="estado"
  class="estado">

📷 Cámara desactivada

</div>


<div id="reader"></div>


<button
  id="btn-camara"
  onclick="iniciarCamara()">

📷 ACTIVAR CÁMARA

</button>


<button
  id="btn-detener"
  onclick="detenerCamara()">

🛑 DETENER CÁMARA

</button>


<div id="resultado"></div>


<button
  id="btn-ir"
  onclick="irAlSistema()">

➡️ ABRIR CONTROL DE BIENES

</button>


<button
  id="btn-nuevo"
  onclick="nuevoQR()">

📷 ESCANEAR OTRO CÓDIGO QR

</button>


<div class="instrucciones">

Apunte la cámara hacia el código QR
de la ficha.

<br><br>

El sistema utilizará únicamente
<strong>el número de la ficha</strong>.

</div>


</div>

</div>


<script>


/* ==========================================================
   URL DE APPS SCRIPT
   ========================================================== */

const URL_WEB_APP =
"https://script.google.com/macros/s/AKfycbztL-8x63-sLW_uObjEHJSI6ekCHfRHOAUZDGRGOAHrhSwzWKe8zjt1ZRvLsPc4ccSj/exec";


/* ==========================================================
   VARIABLES
   ========================================================== */

let lector = null;

let escaneando = false;

let procesandoQR = false;

let fichaDetectada = "";

let urlDestino = "";


/* ==========================================================
   ESTADO
   ========================================================== */

function mostrarEstado(
  mensaje,
  error = false
) {

  const estado =
    document.getElementById(
      "estado"
    );

  estado.textContent =
    mensaje;

  estado.classList.toggle(
    "error",
    error
  );

}


/* ==========================================================
   INICIAR CÁMARA
   ========================================================== */

async function iniciarCamara() {

  if (escaneando) {
    return;
  }

  procesandoQR =
    false;

  fichaDetectada =
    "";

  urlDestino =
    "";


  document.getElementById(
    "resultado"
  ).style.display =
    "none";


  document.getElementById(
    "btn-ir"
  ).style.display =
    "none";


  document.getElementById(
    "btn-nuevo"
  ).style.display =
    "none";


  const reader =
    document.getElementById(
      "reader"
    );


  document.getElementById(
    "btn-camara"
  ).style.display =
    "none";


  document.getElementById(
    "btn-detener"
  ).style.display =
    "block";


  reader.style.display =
    "block";


  mostrarEstado(
    "🎥 Abriendo cámara..."
  );


  try {

    lector =
      new Html5Qrcode(
        "reader"
      );


    await lector.start(

      {
        facingMode:
          "environment"
      },

      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      function(textoQR) {

        procesarQR(
          textoQR
        );

      },

      function(error) {

        // Ignorar errores normales
        // durante la búsqueda.

      }

    );


    escaneando =
      true;


    mostrarEstado(
      "📷 CÁMARA FUNCIONANDO - Apunte al QR"
    );


  }

  catch(error) {

    console.error(
      "ERROR DE CÁMARA:",
      error
    );


    reader.style.display =
      "none";


    document.getElementById(
      "btn-camara"
    ).style.display =
      "block";


    document.getElementById(
      "btn-detener"
    ).style.display =
      "none";


    mostrarEstado(

      "❌ No se pudo acceder a la cámara: " +
      (
        error.message ||
        error
      ),

      true

    );

  }

}


/* ==========================================================
   PROCESAR QR
   ========================================================== */

function procesarQR(
  textoQR
) {

  if (procesandoQR) {
    return;
  }


  const texto =
    String(
      textoQR || ""
    ).trim();


  if (!texto) {
    return;
  }


  /*
   * Extraer únicamente números.
   *
   * SIAFI-21026
   *
   * queda:
   *
   * 21026
   */

  const ficha =
    texto.replace(
      /\D/g,
      ""
    );


  if (!ficha) {

    mostrarEstado(
      "❌ El QR no contiene un número válido.",
      true
    );

    return;

  }


  procesandoQR =
    true;


  fichaDetectada =
    ficha;


  /*
   * Crear URL exacta
   */

  urlDestino =
    URL_WEB_APP +
    "?ficha=" +
    encodeURIComponent(
      ficha
    );


  /*
   * Mostrar resultado
   */

  const resultado =
    document.getElementById(
      "resultado"
    );


  resultado.innerHTML =
    "✅ QR DETECTADO<br><br>" +
    "Ficha: <strong>" +
    ficha +
    "</strong>";


  resultado.style.display =
    "block";


  mostrarEstado(
    "✅ Ficha detectada correctamente."
  );


  /*
   * Detener cámara
   */

  detenerCamara();


  /*
   * Mostrar botón para ir a Apps Script
   */

  document.getElementById(
    "btn-ir"
  ).style.display =
    "block";


  mostrarEstado(
    "👉 Pulse ABRIR CONTROL DE BIENES"
  );

}


/* ==========================================================
   IR A APPS SCRIPT
   ========================================================== */

function irAlSistema() {

  if (!urlDestino) {

    if (!fichaDetectada) {

      mostrarEstado(
        "❌ No hay ninguna ficha detectada.",
        true
      );

      return;

    }


    urlDestino =
      URL_WEB_APP +
      "?ficha=" +
      encodeURIComponent(
        fichaDetectada
      );

  }


  console.log(
    "Abriendo:",
    urlDestino
  );


  /*
   * Navegación directa.
   */

  window.location.assign(
    urlDestino
  );

}


/* ==========================================================
   ESCANEAR OTRO QR
   ========================================================== */

function nuevoQR() {

  fichaDetectada =
    "";

  urlDestino =
    "";

  procesandoQR =
    false;


  document.getElementById(
    "resultado"
  ).style.display =
    "none";


  document.getElementById(
    "btn-ir"
  ).style.display =
    "none";


  document.getElementById(
    "btn-nuevo"
  ).style.display =
    "none";


  iniciarCamara();

}


/* ==========================================================
   DETENER CÁMARA
   ========================================================== */

async function detenerCamara() {

  try {

    if (
      lector &&
      escaneando
    ) {

      await lector.stop();

    }

  }

  catch(error) {

    console.warn(
      error
    );

  }


  try {

    if (lector) {

      await lector.clear();

    }

  }

  catch(error) {

    console.warn(
      error
    );

  }


  lector =
    null;

  escaneando =
    false;


  document.getElementById(
    "reader"
  ).style.display =
    "none";


  document.getElementById(
    "btn-camara"
  ).style.display =
    "block";


  document.getElementById(
    "btn-detener"
  ).style.display =
    "none";

}

</script>


</body>

</html>
