<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Lector QR - Bienes</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;
  padding: 15px;

  min-height: 100vh;

  font-family: Arial, sans-serif;

  background:
    linear-gradient(
      135deg,
      #667eea,
      #764ba2
    );

}

.contenedor {

  max-width: 500px;

  margin: 0 auto;

  background: white;

  border-radius: 15px;

  overflow: hidden;

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.20);

}

.encabezado {

  background: #4CAF50;

  color: white;

  text-align: center;

  padding: 22px 15px;

}

.encabezado h1 {

  margin: 0 0 5px;

  font-size: 23px;

}

.encabezado p {

  margin: 0;

  font-size: 14px;

}

.contenido {

  padding: 20px;

}

.estado {

  text-align: center;

  padding: 15px;

  margin-bottom: 15px;

  border-radius: 10px;

  background: #f1f3f5;

  color: #555;

  font-weight: bold;

}

#reader {

  width: 100%;

  max-width: 400px;

  margin: 0 auto 20px;

  display: none;

  border-radius: 12px;

  overflow: hidden;

  background: #000;

}

#reader video {

  width: 100% !important;

  height: auto !important;

}

button {

  width: 100%;

  padding: 15px;

  margin-bottom: 10px;

  border: none;

  border-radius: 10px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}

#btn-camara {

  background: #4CAF50;

  color: white;

}

#btn-detener {

  background: #dc3545;

  color: white;

  display: none;

}

#btn-ir {

  background: #2196F3;

  color: white;

  display: none;

}

#resultado {

  display: none;

  margin-top: 15px;

  padding: 15px;

  border-radius: 10px;

  text-align: center;

  background: #d4edda;

  color: #155724;

  font-weight: bold;

  word-break: break-word;

}

.instrucciones {

  margin-top: 15px;

  padding: 12px;

  border-radius: 10px;

  background: #e3f2fd;

  color: #1565c0;

  font-size: 13px;

  text-align: center;

}

.error {

  background: #f8d7da;

  color: #721c24;

}

</style>

</head>


<body>


<div class="contenedor">


<div class="encabezado">

<h1>
📷 LECTOR QR
</h1>

<p>
Control de Bienes
</p>

</div>


<div class="contenido">


<div
  id="estado"
  class="estado">

📷 Cámara desactivada

</div>


<div id="reader"></div>


<button
  id="btn-camara"
  onclick="iniciarCamara()">

📷 ACTIVAR CÁMARA

</button>


<button
  id="btn-detener"
  onclick="detenerCamara()">

🛑 DETENER CÁMARA

</button>


<div id="resultado"></div>


<button
  id="btn-ir"
  onclick="irAlSistema()">

➡️ IR AL CONTROL DE BIENES

</button>


<div class="instrucciones">

Apunte la cámara hacia el código QR
de la ficha.

<br><br>

El sistema utilizará únicamente
<strong>el número de la ficha</strong>.

</div>


</div>

</div>


<script>


/* ==========================================================
   URL DEFINITIVA DE APPS SCRIPT
   ========================================================== */

const URL_WEB_APP =
"https://script.google.com/macros/s/AKfycbztL-8x63-sLW_uObjEHJSI6ekCHfRHOAUZDGRGOAHrhSwzWKe8zjt1ZRvLsPc4ccSj/exec";


/* ==========================================================
   VARIABLES
   ========================================================== */

let lector = null;

let escaneando = false;

let procesandoQR = false;

let fichaDetectada = "";


/* ==========================================================
   MOSTRAR ESTADO
   ========================================================== */

function mostrarEstado(
  mensaje,
  error = false
) {

  const estado =
    document.getElementById(
      "estado"
    );

  estado.textContent =
    mensaje;

  estado.classList.toggle(
    "error",
    error
  );

}


/* ==========================================================
   INICIAR CÁMARA
   ========================================================== */

async function iniciarCamara() {

  if (escaneando) {
    return;
  }

  procesandoQR =
    false;

  const reader =
    document.getElementById(
      "reader"
    );

  document.getElementById(
    "btn-camara"
  ).style.display =
    "none";

  document.getElementById(
    "btn-detener"
  ).style.display =
    "block";

  document.getElementById(
    "btn-ir"
  ).style.display =
    "none";


  mostrarEstado(
    "🎥 Abriendo cámara..."
  );


  try {

    reader.style.display =
      "block";


    lector =
      new Html5Qrcode(
        "reader"
      );


    await lector.start(

      {
        facingMode: "environment"
      },

      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      function(textoQR) {

        procesarQR(
          textoQR
        );

      },

      function(error) {

        // Errores normales de búsqueda
        // del QR. No mostramos nada.

      }

    );


    escaneando =
      true;


    mostrarEstado(
      "📷 CÁMARA FUNCIONANDO - Apunte al QR"
    );


  }

  catch(error) {

    console.error(
      error
    );

    reader.style.display =
      "none";

    document.getElementById(
      "btn-camara"
    ).style.display =
      "block";

    document.getElementById(
      "btn-detener"
    ).style.display =
      "none";


    mostrarEstado(

      "❌ No se pudo acceder a la cámara: " +
      (
        error.message ||
        error
      ),

      true

    );

  }

}


/* ==========================================================
   PROCESAR QR
   ========================================================== */

function procesarQR(
  textoQR
) {

  if (procesandoQR) {

    return;

  }


  const texto =
    String(
      textoQR || ""
    ).trim();


  if (!texto) {

    return;

  }


  /*
   * ========================================================
   * EXTRAER SOLAMENTE NÚMEROS
   * ========================================================
   *
   * SIAFI-21026
   *
   * se convierte en:
   *
   * 21026
   */

  const ficha =
    texto.replace(
      /\D/g,
      ""
    );


  if (!ficha) {

    mostrarEstado(
      "❌ El QR no contiene un número válido.",
      true
    );

    return;

  }


  procesandoQR =
    true;


  fichaDetectada =
    ficha;


  /*
   * Mostrar resultado
   */

  const resultado =
    document.getElementById(
      "resultado"
    );

  resultado.textContent =
    "✅ QR detectado: " +
    ficha;

  resultado.style.display =
    "block";


  /*
   * Crear URL
   */

  const destino =
    URL_WEB_APP +
    "?ficha=" +
    encodeURIComponent(
      ficha
    );


  console.log(
    "QR ORIGINAL:",
    texto
  );

  console.log(
    "FICHA:",
    ficha
  );

  console.log(
    "DESTINO:",
    destino
  );


  mostrarEstado(
    "➡️ Abriendo Control de Bienes..."
  );


  /*
   * Mostrar botón de respaldo
   */

  document.getElementById(
    "btn-ir"
  ).style.display =
    "block";


  /*
   * ========================================================
   * REDIRECCIÓN DIRECTA
   * ========================================================
   *
   * IMPORTANTE:
   *
   * NO esperamos a detener la cámara.
   *
   */

  setTimeout(
    function() {

      window.location.href =
        destino;

    },
    500
  );

}


/* ==========================================================
   BOTÓN MANUAL DE RESPALDO
   ========================================================== */

function irAlSistema() {

  if (!fichaDetectada) {

    return;

  }


  const destino =
    URL_WEB_APP +
    "?ficha=" +
    encodeURIComponent(
      fichaDetectada
    );


  window.location.href =
    destino;

}


/* ==========================================================
   DETENER CÁMARA
   ========================================================== */

async function detenerCamara() {

  try {

    if (
      lector &&
      escaneando
    ) {

      await lector.stop();

    }

  }

  catch(error) {

    console.warn(
      error
    );

  }


  try {

    if (lector) {

      await lector.clear();

    }

  }

  catch(error) {

    console.warn(
      error
    );

  }


  lector =
    null;

  escaneando =
    false;


  document.getElementById(
    "reader"
  ).style.display =
    "none";


  document.getElementById(
    "btn-camara"
  ).style.display =
    "block";


  document.getElementById(
    "btn-detener"
  ).style.display =
    "none";

}


</script>


</body>

</html>
