<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Lector QR - Bienes</title>

<script
  src="https://unpkg.com/html5-qrcode">
</script>


<style>

* {

  box-sizing:border-box;

}

body {

  margin:0;

  padding:15px;

  min-height:100vh;

  font-family:
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #667eea,
      #764ba2
    );

}

.contenedor {

  max-width:500px;

  margin:0 auto;

  background:white;

  border-radius:15px;

  overflow:hidden;

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.2);

}

.encabezado {

  background:#4CAF50;

  color:white;

  text-align:center;

  padding:22px 15px;

}

.encabezado h1 {

  margin:0 0 5px;

  font-size:23px;

}

.encabezado p {

  margin:0;

  font-size:14px;

}

.contenido {

  padding:20px;

}

.estado {

  text-align:center;

  padding:12px;

  margin-bottom:15px;

  border-radius:10px;

  background:#f1f3f5;

  color:#555;

  font-weight:bold;

}

#reader {

  width:100%;

  max-width:400px;

  margin:0 auto 20px;

  display:none;

  border-radius:12px;

  overflow:hidden;

  background:#000;

}

#reader video {

  width:100% !important;

  height:auto !important;

}

button {

  width:100%;

  padding:15px;

  margin-bottom:10px;

  border:none;

  border-radius:10px;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

}

#btn-camara {

  background:#4CAF50;

  color:white;

}

#btn-detener {

  background:#dc3545;

  color:white;

  display:none;

}

#resultado {

  display:none;

  margin-top:15px;

  padding:15px;

  border-radius:10px;

  text-align:center;

  background:#d4edda;

  color:#155724;

  font-weight:bold;

  word-break:break-word;

}

.instrucciones {

  margin-top:15px;

  padding:12px;

  border-radius:10px;

  background:#e3f2fd;

  color:#1565c0;

  font-size:13px;

  text-align:center;

}

.error {

  background:#f8d7da;

  color:#721c24;

}

</style>

</head>


<body>


<div class="contenedor">


<div class="encabezado">

<h1>
📷 LECTOR QR
</h1>

<p>
Control de Bienes
</p>

</div>


<div class="contenido">


<div
  id="estado"
  class="estado">

📷 Cámara desactivada

</div>


<div id="reader"></div>


<button
  id="btn-camara"
  onclick="iniciarCamara()">

📷 Activar cámara

</button>


<button
  id="btn-detener"
  onclick="detenerCamara()">

🛑 Detener cámara

</button>


<div id="resultado"></div>


<div class="instrucciones">

Apunte la cámara hacia el
código QR de la ficha.

<br><br>

El número de ficha puede venir
como <strong>SIAFI-21026</strong>.

</div>


</div>

</div>


<script>


/* ==========================================================
   CONFIGURACIÓN
   ========================================================== */


/*
 * IMPORTANTE:
 *
 * Esta es la URL ACTUAL de tu Web App de Apps Script.
 */

const URL_WEB_APP =
  "https://script.google.com/macros/s/AKfycbztL-8x63-sLW_uObjEHJSI6ekCHfRHOAUZDGRGOAHrhSwzWKe8zjt1ZRvLsPc4ccSj/exec";


let lector = null;

let escaneando = false;

let ultimoQR = "";

let ultimaLectura = 0;


/* ==========================================================
   ESTADO
   ========================================================== */

function mostrarEstado(
  mensaje,
  error = false
) {

  const estado =
    document.getElementById(
      "estado"
    );


  estado.textContent =
    mensaje;


  estado.classList.toggle(
    "error",
    error
  );

}


/* ==========================================================
   RESULTADO
   ========================================================== */

function mostrarResultado(
  texto
) {

  const resultado =
    document.getElementById(
      "resultado"
    );


  resultado.textContent =
    "✅ QR detectado: " +
    texto;


  resultado.style.display =
    "block";

}


/* ==========================================================
   OBTENER ÚNICAMENTE EL NÚMERO
   ========================================================== */

function obtenerNumeroFicha(
  textoQR
) {

  const texto =
    String(
      textoQR || ""
    ).trim();


  /*
   * Ejemplos:
   *
   * SIAFI-21026  → 21026
   * SIAFI-12345  → 12345
   * 21026        → 21026
   *
   * Se eliminan todos los caracteres
   * que no sean números.
   */

  const numero =
    texto.replace(
      /\D/g,
      ""
    );


  return numero;

}


/* ==========================================================
   INICIAR CÁMARA
   ========================================================== */

async function iniciarCamara() {

  if (escaneando)
    return;


  const reader =
    document.getElementById(
      "reader"
    );


  const boton =
    document.getElementById(
      "btn-camara"
    );


  const detener =
    document.getElementById(
      "btn-detener"
    );


  mostrarEstado(
    "🎥 Solicitando permiso para usar la cámara..."
  );


  try {


    /*
     * Primero comprobamos que el navegador
     * permita utilizar la cámara.
     */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "CAMARA_NO_DISPONIBLE"
      );

    }


    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal:"environment"
            }

          },

          audio:false

        });


    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    reader.style.display =
      "block";


    boton.style.display =
      "none";


    detener.style.display =
      "block";


    lector =
      new Html5Qrcode(
        "reader"
      );


    const configuracion = {

      fps:10,

      qrbox:function(
        ancho,
        alto
      ) {

        const tamaño =
          Math.min(
            ancho * 0.75,
            alto * 0.75,
            300
          );


        return {

          width:tamaño,

          height:tamaño

        };

      },

      aspectRatio:1.0,

      disableFlip:false

    };


    await lector.start(

      {
        facingMode:
          "environment"
      },

      configuracion,

      function(textoQR) {

        procesarQR(
          textoQR
        );

      },

      function() {}

    );


    escaneando =
      true;


    mostrarEstado(
      "📷 Cámara funcionando. Apunte al código QR."
    );


  }

  catch(error) {

    console.error(
      "ERROR DE CÁMARA:",
      error
    );


    reader.style.display =
      "none";


    boton.style.display =
      "block";


    detener.style.display =
      "none";


    let mensaje =
      "❌ No se pudo acceder a la cámara.";


    if (
      error &&
      error.name ===
      "NotAllowedError"
    ) {

      mensaje =
        "❌ El navegador bloqueó el acceso a la cámara.";

    }

    else if (
      error &&
      error.name ===
      "NotFoundError"
    ) {

      mensaje =
        "❌ No se encontró una cámara disponible.";

    }

    else if (
      error &&
      error.name ===
      "NotReadableError"
    ) {

      mensaje =
        "❌ La cámara está siendo utilizada por otra aplicación.";

    }

    else if (
      error &&
      error.name ===
      "SecurityError"
    ) {

      mensaje =
        "❌ El navegador bloqueó la cámara por seguridad.";

    }

    else if (
      error &&
      error.message ===
      "CAMARA_NO_DISPONIBLE"
    ) {

      mensaje =
        "❌ Este navegador no permite utilizar la cámara.";

    }


    mostrarEstado(
      mensaje,
      true
    );

  }

}


/* ==========================================================
   DETENER CÁMARA
   ========================================================== */

async function detenerCamara() {

  try {

    if (
      lector &&
      escaneando
    ) {

      await lector.stop();

    }


    if (lector) {

      await lector.clear();

    }

  }

  catch(error) {

    console.warn(
      error
    );

  }


  lector =
    null;


  escaneando =
    false;


  document.getElementById(
    "reader"
  ).style.display =
    "none";


  document.getElementById(
    "btn-camara"
  ).style.display =
    "block";


  document.getElementById(
    "btn-detener"
  ).style.display =
    "none";


  mostrarEstado(
    "📷 Cámara desactivada"
  );

}


/* ==========================================================
   PROCESAR QR
   ========================================================== */

function procesarQR(
  textoQR
) {

  const ahora =
    Date.now();


  const texto =
    String(
      textoQR || ""
    ).trim();


  if (!texto)
    return;


  /*
   * Evitar detectar el mismo QR
   * varias veces.
   */

  if (
    texto === ultimoQR &&
    ahora - ultimaLectura < 3000
  ) {

    return;

  }


  ultimoQR =
    texto;


  ultimaLectura =
    ahora;


  /*
   * OBTENER SOLAMENTE NÚMEROS.
   */

  const numeroFicha =
    obtenerNumeroFicha(
      texto
    );


  if (!numeroFicha) {

    mostrarEstado(
      "❌ El QR no contiene un número de ficha.",
      true
    );

    return;

  }


  mostrarResultado(
    texto +
    " → Ficha " +
    numeroFicha
  );


  mostrarEstado(
    "✅ Código detectado. Abriendo Control de Bienes..."
  );


  detenerCamara();


  /*
   * ========================================================
   * CREAR URL DE APPS SCRIPT
   * ========================================================
   *
   * Ejemplo:
   *
   * https://script.google.com/.../exec?ficha=21026
   *
   */

  const destino =
    URL_WEB_APP +
    "?ficha=" +
    encodeURIComponent(
      numeroFicha
    );


  /*
   * Pequeña pausa para permitir
   * detener correctamente la cámara.
   */

  setTimeout(
    function() {

      window.location.assign(
        destino
      );

    },
    500
  );

}


</script>


</body>

</html>
