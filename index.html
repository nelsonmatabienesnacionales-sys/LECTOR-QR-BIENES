<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Lector QR - Bienes</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;
      padding: 15px;

      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

    }

    .contenedor {

      max-width: 500px;

      margin: 0 auto;

      background: white;

      border-radius: 15px;

      overflow: hidden;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,.2);

    }

    .encabezado {

      background: #4CAF50;

      color: white;

      text-align: center;

      padding: 22px 15px;

    }

    .encabezado h1 {

      margin: 0 0 5px;

      font-size: 23px;

    }

    .encabezado p {

      margin: 0;

      font-size: 14px;

    }

    .contenido {

      padding: 20px;

    }

    .estado {

      text-align: center;

      padding: 12px;

      margin-bottom: 15px;

      border-radius: 10px;

      background: #f1f3f5;

      color: #555;

      font-weight: bold;

    }

    #reader {

      width: 100%;

      max-width: 400px;

      margin: 0 auto 20px;

      display: none;

      border-radius: 12px;

      overflow: hidden;

      background: #000;

    }

    #reader video {

      width: 100% !important;

      height: auto !important;

      display: block;

    }

    button {

      width: 100%;

      padding: 15px;

      margin-bottom: 10px;

      border: none;

      border-radius: 10px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }

    #btn-camara {

      background: #4CAF50;

      color: white;

    }

    #btn-detener {

      background: #dc3545;

      color: white;

      display: none;

    }

    #resultado {

      display: none;

      margin-top: 15px;

      padding: 15px;

      border-radius: 10px;

      text-align: center;

      background: #d4edda;

      color: #155724;

      font-weight: bold;

      word-break: break-word;

    }

    .instrucciones {

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #e3f2fd;

      color: #1565c0;

      font-size: 13px;

      text-align: center;

    }

    .error {

      background: #f8d7da;

      color: #721c24;

    }

    .exito {

      background: #d4edda;

      color: #155724;

    }

  </style>

</head>


<body>


<div class="contenedor">


  <div class="encabezado">

    <h1>
      📷 LECTOR QR
    </h1>

    <p>
      Control de Bienes
    </p>

  </div>


  <div class="contenido">


    <div
      id="estado"
      class="estado">

      📷 Cámara desactivada

    </div>


    <div id="reader"></div>


    <button
      id="btn-camara"
      type="button"
      onclick="iniciarCamara()">

      📷 Activar cámara

    </button>


    <button
      id="btn-detener"
      type="button"
      onclick="detenerCamara()">

      🛑 Detener cámara

    </button>


    <div id="resultado"></div>


    <div class="instrucciones">

      Apunte la cámara hacia el código QR
      de la ficha.

      <br><br>

      El código debe tener un formato como:

      <br>

      <strong>SIAFI-12345</strong>

    </div>


  </div>

</div>


<script>


/* ==========================================================
   URL DE TU WEB APP DE GOOGLE APPS SCRIPT
   ========================================================== */

const URL_WEB_APP =
  "https://script.google.com/macros/s/AKfycbzuWUxuHh6Rp1uTbgo3PYKsDXn6B2FerY_tBhVdypZzYqIdLyOvJUQtLczzQGVq9deW/exec";


/* ==========================================================
   VARIABLES
   ========================================================== */

let lector = null;

let escaneando = false;

let procesandoQR = false;

let ultimoQR = "";

let ultimaLectura = 0;


/* ==========================================================
   MOSTRAR ESTADO
   ========================================================== */

function mostrarEstado(
  mensaje,
  error = false
) {

  const estado =
    document.getElementById(
      "estado"
    );

  estado.textContent =
    mensaje;

  estado.classList.remove(
    "error",
    "exito"
  );

  if (error) {

    estado.classList.add(
      "error"
    );

  }

}


/* ==========================================================
   MOSTRAR RESULTADO
   ========================================================== */

function mostrarResultado(
  texto
) {

  const resultado =
    document.getElementById(
      "resultado"
    );

  resultado.textContent =
    "✅ QR detectado: " + texto;

  resultado.style.display =
    "block";

}


/* ==========================================================
   NORMALIZAR FICHA
   ========================================================== */

function obtenerFicha(
  textoQR
) {

  let texto =
    String(
      textoQR || ""
    )
    .trim();


  if (!texto)
    return "";


  /*
   * Si el QR contiene una URL con:
   *
   * ?ficha=SIAFI-123
   *
   * intentamos obtener automáticamente
   * el valor de ficha.
   */

  try {

    if (
      texto.startsWith("http://") ||
      texto.startsWith("https://")
    ) {

      const url =
        new URL(texto);

      const ficha =
        url.searchParams.get(
          "ficha"
        );

      if (ficha) {

        texto =
          ficha.trim();

      }

    }

  }

  catch (error) {

    console.warn(
      "No fue posible interpretar la URL del QR.",
      error
    );

  }


  /*
   * Limpiar espacios.
   */

  texto =
    texto.trim();


  /*
   * Convertir a mayúsculas.
   */

  texto =
    texto.toUpperCase();


  return texto;

}


/* ==========================================================
   VALIDAR FICHA
   ========================================================== */

function validarFicha(
  ficha
) {

  /*
   * Acepta:
   *
   * SIAFI-123
   * SIAFI-00123
   * SIAFI-12345
   *
   * También permite espacios alrededor,
   * que ya fueron eliminados.
   */

  const patron =
    /^SIAFI-[A-Z0-9-]+$/i;


  return patron.test(
    ficha
  );

}


/* ==========================================================
   INICIAR CÁMARA
   ========================================================== */

async function iniciarCamara() {

  if (escaneando)
    return;


  if (procesandoQR)
    return;


  const reader =
    document.getElementById(
      "reader"
    );


  const boton =
    document.getElementById(
      "btn-camara"
    );


  const detener =
    document.getElementById(
      "btn-detener"
    );


  mostrarEstado(
    "🎥 Solicitando permiso para usar la cámara..."
  );


  try {

    /*
     * Mostrar lector.
     */

    reader.style.display =
      "block";


    boton.style.display =
      "none";


    detener.style.display =
      "block";


    /*
     * Crear lector.
     */

    lector =
      new Html5Qrcode(
        "reader"
      );


    const configuracion = {

      fps: 10,

      qrbox: function(
        ancho,
        alto
      ) {

        const tamaño =
          Math.min(
            ancho * 0.75,
            alto * 0.75,
            300
          );


        return {

          width:
            tamaño,

          height:
            tamaño

        };

      },

      aspectRatio: 1.0,

      disableFlip: false

    };


    /*
     * IMPORTANTE:
     *
     * Html5Qrcode solicita directamente
     * el acceso a la cámara.
     *
     * Ya no hacemos getUserMedia()
     * antes de esto.
     */

    await lector.start(

      {
        facingMode:
          "environment"
      },

      configuracion,

      function(textoQR) {

        procesarQR(
          textoQR
        );

      },

      function(errorMessage) {

        /*
         * Los errores de lectura continua
         * son normales mientras busca el QR.
         *
         * No mostramos error en pantalla
         * para no molestar al usuario.
         */

      }

    );


    escaneando =
      true;


    mostrarEstado(
      "📷 Escaneando... Apunte al código QR"
    );


  }

  catch (error) {

    console.error(
      "ERROR DE CÁMARA:",
      error
    );


    reader.style.display =
      "none";


    boton.style.display =
      "block";


    detener.style.display =
      "none";


    let mensaje =
      "❌ No se pudo acceder a la cámara.";


    if (
      error &&
      (
        error.name ===
          "NotAllowedError" ||

        error.message &&
        error.message
          .toLowerCase()
          .includes(
            "permission"
          )
      )
    ) {

      mensaje =
        "❌ El navegador bloqueó el acceso a la cámara. Verifique los permisos del sitio.";

    }

    else if (
      error &&
      error.name ===
        "NotFoundError"
    ) {

      mensaje =
        "❌ No se encontró una cámara disponible.";

    }

    else if (
      error &&
      error.name ===
        "NotReadableError"
    ) {

      mensaje =
        "❌ La cámara está siendo utilizada por otra aplicación.";

    }

    else if (
      error &&
      error.name ===
        "SecurityError"
    ) {

      mensaje =
        "❌ El navegador bloqueó el acceso por seguridad.";

    }

    else if (
      error &&
      error.message
    ) {

      mensaje =
        "❌ " +
        error.message;

    }


    mostrarEstado(
      mensaje,
      true
    );

  }

}


/* ==========================================================
   DETENER CÁMARA
   ========================================================== */

async function detenerCamara() {

  try {

    if (
      lector &&
      escaneando
    ) {

      await lector.stop();

    }

  }

  catch (error) {

    console.warn(
      "Error al detener cámara:",
      error
    );

  }


  try {

    if (lector) {

      await lector.clear();

    }

  }

  catch (error) {

    console.warn(
      "Error al limpiar lector:",
      error
    );

  }


  lector =
    null;


  escaneando =
    false;


  document.getElementById(
    "reader"
  ).style.display =
    "none";


  document.getElementById(
    "btn-camara"
  ).style.display =
    "block";


  document.getElementById(
    "btn-detener"
  ).style.display =
    "none";

}


/* ==========================================================
   PROCESAR QR
   ========================================================== */

async function procesarQR(
  textoQR
) {

  if (procesandoQR)
    return;


  const ahora =
    Date.now();


  const textoOriginal =
    String(
      textoQR || ""
    ).trim();


  if (!textoOriginal)
    return;


  /*
   * Evitar lecturas repetidas.
   */

  if (
    textoOriginal === ultimoQR &&
    ahora - ultimaLectura < 3000
  ) {

    return;

  }


  ultimoQR =
    textoOriginal;


  ultimaLectura =
    ahora;


  /*
   * Obtener ficha.
   */

  const ficha =
    obtenerFicha(
      textoOriginal
    );


  /*
   * Validar que sea una ficha SIAFI.
   */

  if (
    !validarFicha(
      ficha
    )
  ) {

    mostrarResultado(
      textoOriginal
    );


    mostrarEstado(
      "⚠️ El código QR no contiene una ficha SIAFI válida.",
      true
    );


    return;

  }


  procesandoQR =
    true;


  mostrarResultado(
    ficha
  );


  mostrarEstado(
    "✅ Ficha detectada: " +
    ficha +
    " | Abriendo ficha..."
  );


  /*
   * Detener cámara.
   */

  await detenerCamara();


  /*
   * Construir URL.
   */

  const separador =
    URL_WEB_APP.includes("?")
      ? "&"
      : "?";


  const destino =
    URL_WEB_APP +
    separador +
    "ficha=" +
    encodeURIComponent(
      ficha
    );


  /*
   * Pequeña pausa para permitir
   * que la cámara se cierre.
   */

  setTimeout(
    function() {

      window.location.href =
        destino;

    },
    500
  );

}


/* ==========================================================
   LIMPIEZA AL SALIR
   ========================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (
      lector &&
      escaneando
    ) {

      lector
        .stop()
        .catch(
          function() {}
        );

    }

  }
);


</script>


</body>

</html>
