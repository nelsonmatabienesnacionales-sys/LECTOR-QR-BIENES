<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Lector QR - Bienes</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;
  padding: 12px;

  min-height: 100vh;

  font-family: Arial, sans-serif;

  background:
    linear-gradient(
      135deg,
      #667eea,
      #764ba2
    );

}

.contenedor {

  width: 100%;

  max-width: 500px;

  margin: 0 auto;

  background: white;

  border-radius: 15px;

  overflow: hidden;

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.2);

}

.encabezado {

  background: #4CAF50;

  color: white;

  text-align: center;

  padding: 22px 15px;

}

.encabezado h1 {

  margin: 0 0 5px;

  font-size: 23px;

}

.encabezado p {

  margin: 0;

  font-size: 14px;

}

.contenido {

  padding: 20px;

}

.estado {

  text-align: center;

  padding: 13px;

  margin-bottom: 15px;

  border-radius: 10px;

  background: #f1f3f5;

  color: #555;

  font-weight: bold;

}

#reader {

  width: 100%;

  max-width: 420px;

  margin: 0 auto 20px;

  display: none;

  border-radius: 12px;

  overflow: hidden;

  background: #000;

}

#reader video {

  width: 100% !important;

  height: auto !important;

}

button {

  width: 100%;

  padding: 16px;

  margin-bottom: 10px;

  border: none;

  border-radius: 10px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

#btn-camara {

  background: #4CAF50;

  color: white;

}

#btn-detener {

  background: #dc3545;

  color: white;

  display: none;

}

#resultado {

  display: none;

  margin-top: 15px;

  padding: 15px;

  border-radius: 10px;

  text-align: center;

  background: #d4edda;

  color: #155724;

  font-weight: bold;

  word-break: break-word;

}

.instrucciones {

  margin-top: 15px;

  padding: 12px;

  border-radius: 10px;

  background: #e3f2fd;

  color: #1565c0;

  font-size: 13px;

  text-align: center;

}

.error {

  background: #f8d7da;

  color: #721c24;

}

</style>

</head>

<body>

<div class="contenedor">

  <div class="encabezado">

    <h1>📷 LECTOR QR</h1>

    <p>Control de Bienes</p>

  </div>

  <div class="contenido">

    <div
      id="estado"
      class="estado">

      📷 Cámara desactivada

    </div>

    <div id="reader"></div>

    <button
      id="btn-camara"
      type="button"
      onclick="iniciarCamara()">

      📷 ACTIVAR CÁMARA

    </button>

    <button
      id="btn-detener"
      type="button"
      onclick="detenerCamara()">

      🛑 DETENER CÁMARA

    </button>

    <div id="resultado"></div>

    <div class="instrucciones">

      Apunte la cámara hacia el código QR
      de la ficha.

      <br><br>

      El sistema utilizará únicamente
      los números de la ficha.

    </div>

  </div>

</div>


<script>

/* ==========================================================
   URL ACTUAL DE APPS SCRIPT
   ========================================================== */

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbxKpsR2pL2tULdxnfot9DM_vJOic-PshIfXVZEarIQZB_nGrabyahTHVYX3Cc8BUESM/exec";


/* ==========================================================
   VARIABLES
   ========================================================== */

let lector = null;

let escaneando = false;

let procesandoQR = false;


/* ==========================================================
   ESTADO
   ========================================================== */

function mostrarEstado(
  mensaje,
  error = false
) {

  const elemento =
    document.getElementById(
      "estado"
    );

  elemento.textContent =
    mensaje;

  elemento.classList.toggle(
    "error",
    error
  );

}


/* ==========================================================
   RESULTADO
   ========================================================== */

function mostrarResultado(
  texto
) {

  const resultado =
    document.getElementById(
      "resultado"
    );

  resultado.textContent =
    "✅ QR detectado: " +
    texto;

  resultado.style.display =
    "block";

}


/* ==========================================================
   INICIAR CÁMARA
   ========================================================== */

async function iniciarCamara() {

  if (escaneando)
    return;

  procesandoQR = false;

  const reader =
    document.getElementById(
      "reader"
    );

  const boton =
    document.getElementById(
      "btn-camara"
    );

  const detener =
    document.getElementById(
      "btn-detener"
    );

  mostrarEstado(
    "🎥 Solicitando permiso para usar la cámara..."
  );

  try {

    /*
     * Comprobar que el navegador
     * tenga acceso a getUserMedia.
     */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "CAMARA_NO_DISPONIBLE"
      );

    }


    /*
     * Pedimos permiso explícitamente.
     */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


    /*
     * Cerramos esta prueba.
     * html5-qrcode abrirá la cámara
     * nuevamente para escanear.
     */

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );


    reader.style.display =
      "block";

    boton.style.display =
      "none";

    detener.style.display =
      "block";


    lector =
      new Html5Qrcode(
        "reader"
      );


    const configuracion = {

      fps: 10,

      qrbox: function(
        ancho,
        alto
      ) {

        const tamaño =
          Math.min(
            ancho * 0.75,
            alto * 0.75,
            300
          );

        return {

          width: tamaño,

          height: tamaño

        };

      },

      aspectRatio: 1.0,

      disableFlip: false

    };


    await lector.start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      configuracion,

      function(textoQR) {

        procesarQR(
          textoQR
        );

      },

      function() {}

    );


    escaneando = true;

    mostrarEstado(
      "📷 Cámara funcionando. Apunte al código QR."
    );

  }

  catch (error) {

    console.error(
      "ERROR CÁMARA:",
      error
    );

    reader.style.display =
      "none";

    boton.style.display =
      "block";

    detener.style.display =
      "none";

    mostrarEstado(
      "❌ No se pudo acceder a la cámara. Revise el permiso de cámara del navegador.",
      true
    );

  }

}


/* ==========================================================
   DETENER CÁMARA
   ========================================================== */

async function detenerCamara() {

  try {

    if (lector) {

      if (escaneando) {

        await lector.stop();

      }

      await lector.clear();

    }

  }

  catch (error) {

    console.warn(
      error
    );

  }

  lector = null;

  escaneando = false;

  document.getElementById(
    "reader"
  ).style.display =
    "none";

  document.getElementById(
    "btn-camara"
  ).style.display =
    "block";

  document.getElementById(
    "btn-detener"
  ).style.display =
    "none";

}


/* ==========================================================
   PROCESAR QR
   ========================================================== */

async function procesarQR(
  textoQR
) {

  if (procesandoQR)
    return;

  procesandoQR = true;


  /*
   * Convertir a texto.
   */

  let texto =
    String(
      textoQR || ""
    ).trim();


  if (!texto) {

    procesandoQR = false;

    return;

  }


  /*
   * SOLO NÚMEROS.
   *
   * Ejemplo:
   *
   * SIAFI-21026
   * 21026
   * FICHA 21026
   *
   * terminarán como:
   *
   * 21026
   */

  const ficha =
    texto.replace(
      /\D/g,
      ""
    );


  if (!ficha) {

    mostrarEstado(
      "❌ El QR no contiene un número de ficha válido.",
      true
    );

    procesandoQR = false;

    return;

  }


  mostrarResultado(
    ficha
  );


  mostrarEstado(
    "✅ Ficha " +
    ficha +
    " detectada. Abriendo control de bienes..."
  );


  /*
   * DETENER CÁMARA.
   */

  await detenerCamara();


  /*
   * CONSTRUIR URL.
   *
   * IMPORTANTE:
   * Esta es la única salida de GitHub.
   */

  const destino =
    URL_APPS_SCRIPT +
    "?ficha=" +
    encodeURIComponent(
      ficha
    );


  /*
   * Navegación absoluta.
   */

  setTimeout(
    function() {

      window.location.replace(
        destino
      );

    },
    500
  );

}

</script>

</body>

</html>
